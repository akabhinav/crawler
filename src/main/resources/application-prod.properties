# ============================================================================
# Production Configuration Profile
# Use: java -jar crawler.jar --spring.profiles.active=prod
# ============================================================================

# Production concurrency (scale based on hardware)
crawler.concurrency=500
crawler.max-depth=10

# More aggressive timeouts
crawler.fetcher.timeout=5000

# Production logging
logging.level.root=WARN
logging.level.com.webcrawler=INFO

# JSON logging for log aggregation
logging.pattern.console={"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%level","thread":"%thread","logger":"%logger","message":"%msg"}%n

# Use filesystem or distributed storage
crawler.storage.type=filesystem
crawler.storage.path=/data/crawler/pages

# Production circuit breaker (more conservative)
resilience4j.circuitbreaker.instances.fetcher.failure-rate-threshold=30
resilience4j.circuitbreaker.instances.fetcher.wait-duration-in-open-state=60s
