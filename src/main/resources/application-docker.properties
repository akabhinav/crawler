# ============================================================================
# Docker Compose Configuration Profile
# Use: Automatically activated when running in Docker Compose
# ============================================================================

# Application
spring.application.name=distributed-web-crawler
server.port=8080

# Virtual Threads
spring.threads.virtual.enabled=true

# Crawler Configuration
crawler.concurrency=200
crawler.max-depth=10
crawler.enable-robots-txt=true

# Fetcher Configuration
crawler.fetcher.timeout=10000
crawler.fetcher.user-agent=Mozilla/5.0 (compatible; DistributedCrawler/1.0; +http://example.com/bot)

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/crawler
spring.datasource.username=crawler
spring.datasource.password=crawler123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# URL Frontier Configuration
crawler.frontier.type=redis
crawler.frontier.max-urls-per-domain=100000
crawler.politeness.delay=500

# MinIO/S3 Storage Configuration
crawler.storage.type=minio
crawler.storage.minio.endpoint=http://minio:9000
crawler.storage.minio.access-key=minioadmin
crawler.storage.minio.secret-key=minioadmin
crawler.storage.minio.bucket=crawler-pages
crawler.storage.minio.compression=true

# Metadata Service
crawler.metadata.enabled=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=robotRules
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=24h

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.fetcher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fetcher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.fetcher.sliding-window-size=100
resilience4j.circuitbreaker.instances.fetcher.minimum-number-of-calls=10

# Resilience4j - Rate Limiter
resilience4j.ratelimiter.instances.fetcher.limit-for-period=1000
resilience4j.ratelimiter.instances.fetcher.limit-refresh-period=1s
resilience4j.ratelimiter.instances.fetcher.timeout-duration=5s

# Resilience4j - Retry
resilience4j.retry.instances.fetcher.max-attempts=3
resilience4j.retry.instances.fetcher.wait-duration=2s

# Actuator - Monitoring endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.webcrawler=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
