# ============================================================================
# Distributed Web Crawler Configuration
# Production-ready settings for trillion-scale crawling
# ============================================================================

# Application
spring.application.name=distributed-web-crawler
server.port=8080

# Virtual Threads (Java 21 feature for massive concurrency)
spring.threads.virtual.enabled=true

# Crawler Configuration
crawler.concurrency=100
crawler.max-depth=5
crawler.enable-robots-txt=true

# Fetcher Configuration
crawler.fetcher.timeout=10000
crawler.fetcher.user-agent=Mozilla/5.0 (compatible; DistributedCrawler/1.0; +http://example.com/bot)

# Domain Filtering (comma-separated)
# Leave empty to crawl all domains
crawler.filter.allowed-domains=
crawler.filter.blocked-domains=

# Storage Configuration
crawler.storage.type=memory

# For production, use one of these:
# crawler.storage.type=filesystem
# crawler.storage.path=/data/crawler
#
# crawler.storage.type=s3
# crawler.storage.s3.bucket=my-crawler-bucket
#
# crawler.storage.type=elasticsearch
# crawler.storage.elasticsearch.url=http://localhost:9200

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=robotRules
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=24h

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.fetcher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fetcher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.fetcher.sliding-window-size=100
resilience4j.circuitbreaker.instances.fetcher.minimum-number-of-calls=10

# Resilience4j - Rate Limiter
resilience4j.ratelimiter.instances.fetcher.limit-for-period=1000
resilience4j.ratelimiter.instances.fetcher.limit-refresh-period=1s
resilience4j.ratelimiter.instances.fetcher.timeout-duration=5s

# Resilience4j - Retry
resilience4j.retry.instances.fetcher.max-attempts=3
resilience4j.retry.instances.fetcher.wait-duration=2s

# Actuator - Monitoring endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.webcrawler=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# For production, use JSON logging:
# logging.pattern.console={"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%level","thread":"%thread","logger":"%logger","message":"%msg"}%n
